name: Quality

on:
  push:
    branches: [main, work/drm-energia-melhorias]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-smoke-secret
      NODE_ENV: development
      PORT: 3001
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SMOKE_MUTATING: "1"
      SMOKE_BASE_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: npm run check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/drm-backend.log 2>&1 &
          echo $! > /tmp/drm-backend.pid
          for i in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:3001/api/admin/clientes; then
              break
            fi
            sleep 1
          done

      - name: Smoke critical flows
        working-directory: backend
        run: npm test

      - name: Backend log
        if: always()
        run: tail -120 /tmp/drm-backend.log || true
