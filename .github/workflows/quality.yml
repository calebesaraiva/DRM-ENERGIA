name: Quality

on:
  push:
    branches: [main, work/drm-energia-melhorias]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-smoke-secret
      NODE_ENV: development
      PORT: 3001
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SMOKE_MUTATING: "1"
      SMOKE_BASE_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: npm run check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/drm-backend.log 2>&1 &
          echo $! > /tmp/drm-backend.pid
          for i in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:3001/api/admin/clientes; then
              break
            fi
            sleep 1
          done

      - name: Smoke critical flows
        working-directory: backend
        run: npm test

      - name: Backend log
        if: always()
        run: tail -120 /tmp/drm-backend.log || true

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Prepare SSH
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drm_vps_key
          chmod 600 ~/.ssh/drm_vps_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy DRM Energia
        run: |
          ssh -i ~/.ssh/drm_vps_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "set -e
            cd /var/www/DRM-ENERGIA
            mkdir -p /root/deploy-backups
            ts=\$(date +%Y%m%d-%H%M%S)
            backup=/root/deploy-backups/drm-energia-\$ts.tar.gz
            tar -czf \"\$backup\" \
              --exclude=.git \
              --exclude=node_modules \
              --exclude=dist \
              --exclude=build \
              -C /var/www/DRM-ENERGIA . 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cd frontend
            bash deploy_vps.sh
            echo DEPLOY_OK:drm-energia
            echo BACKUP:\$backup"

      - name: Verify production
        run: |
          curl -fsSI https://drmenergiasolar.com.br/
          ssh -i ~/.ssh/drm_vps_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "set -e
            test \"\$(systemctl is-active drm-solar-backend)\" = active
            test \"\$(systemctl is-active nginx)\" = active
            cd /var/www/DRM-ENERGIA/backend
            SMOKE_BASE_URL=http://127.0.0.1:3401 npm test"
